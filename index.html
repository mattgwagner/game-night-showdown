function renderHostBuzzPanel() {
  const el = document.getElementById('buzzPanelHost');
  if (!el) return;
  if (!buzz.connected) { el.innerHTML = ''; return; }
  const lead = buzz.queue[0];
  const points = (buzzQuestion && buzzQuestion.val) || 0;
  const cat = (buzzQuestion && buzzQuestion.cat) || '';
  if (!buzz.armed && !lead) {
    el.innerHTML = `<div class="buzz-panel"><div class="buzz-meta">Buzzers connected (${buzz.players.length})</div></div>`;
    return;
  }
  if (!lead) {
    el.innerHTML = `<div class="buzz-panel"><div class="buzz-meta">Listening… ${buzz.players.length} phone${buzz.players.length === 1 ? '' : 's'}</div></div>`;
    return;
  }
  const team = resolveBuzzTeam(lead);
  const rest = buzz.queue.slice(1).map(q => escapeHtml(q.name)).join(', ');
  el.innerHTML = `
    <div class="buzz-panel">
      <div class="buzz-meta">Buzzed in</div>
      <div class="buzz-lead">${escapeHtml(lead.name)}${lead.teamName ? ' · ' + escapeHtml(lead.teamName) : ''}</div>
      <div class="row-gap judge-row">
        <button class="btn-primary" id="buzzYes">Correct${team && points ? ' (+' + points + ')' : ''}</button>
        <button class="btn-secondary" id="buzzNo">Wrong</button>
      </div>
      ${rest ? `<div class="buzz-queue">Next: ${rest}</div>` : ''}
    </div>`;
  document.getElementById('buzzYes').onclick = () => {
    const t = resolveBuzzTeam(buzz.queue[0]) || team;
    if (!t) {
      flashToast('Reveal and pick their team');
      const reveal = document.getElementById('revealBtn');
      if (reveal) reveal.click();
      return;
    }
    if (buzz.connected) buzzDisarm();
    scoreEvent(t, points, { isAnswer: true });
    playCorrect();
    markUsedAndReturn(cat, points);
  };
  document.getElementById('buzzNo').onclick = () => {
    playWrong();
    buzzPop();
  };
}

/* ---------- Player join (?join=CODE) ---------- */
function getJoinCode() {
  const q = new URLSearchParams(location.search);
  return (q.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
}

function renderBuzzJoin() {
  document.body.classList.add('on-buzz');

function renderBuzzJoinApp() {
  const root = document.getElementById('buzzJoinRoot');
  if (!root) return;

  // Step 1: name
  if (!buzz.connected) {
    root.innerHTML = `
      <h2 style="text-align:center;color:var(--gold);">Join</h2>
      <div class="buzz-code">${escapeHtml(buzz.joinCode || '————')}</div>
      <div class="team-row"><input id="buzzName" type="text" placeholder="Your name" maxlength="24" style="font-size:16px;" /></div>

    document.getElementById('buzzJoinBtn').onclick = async () => {
      const name = (document.getElementById('buzzName').value || '').trim();
      if (!name) { flashToast('Enter your name'); return; }
      buzz.name = name;
      try {
        await connectBuzzSocket(buzz.joinCode, 'player', { name });
        renderBuzzJoinApp();
      } catch {
        flashToast('Could not join — is the host online?');
      }
    };
    return;
  }

  // Step 2: pick team if needed
  if (buzz.teams.length && !buzz.teamName) {
    root.innerHTML = `
      <h2 style="text-align:center;color:var(--gold);">${escapeHtml(buzz.name)}</h2>
      <div class="who-line" style="text-align:center;">Your team</div>
      <div id="buzzTeamPick" style="margin:10px 0;"></div>
      <button class="btn-primary btn-full" id="buzzTeamGo" disabled>Continue</button>`;
    const box = document.getElementById('buzzTeamPick');
    box.innerHTML = `<div class="team-btn-grid">${buzz.teams.map(tm =>
      `<button class="team-btn" data-team="${tm.id}" data-name="${escapeHtml(tm.name)}" style="border-color:${tm.color || 'var(--gold)'}">${escapeHtml(tm.name)}</button>`
    ).join('')}</div>`;
    const go = document.getElementById('buzzTeamGo');
    box.querySelectorAll('[data-team]').forEach(btn => {
      btn.onclick = () => {
        box.querySelectorAll('[data-team]').forEach(b => {
          b.classList.remove('on');
          b.style.background = '';
        });
        btn.classList.add('on');
        btn.style.background = 'rgba(46,204,113,.25)';
        buzz.teamId = parseInt(btn.dataset.team, 10);
        const tm = buzz.teams.find(x => x.id == buzz.teamId);
        buzz.teamName = tm ? tm.name : '';
        go.disabled = false;
      };
    });
    go.onclick = () => {
      buzzSend({
        type: 'hello',
        role: 'player',
        name: buzz.name,
        teamId: buzz.teamId,
        teamName: buzz.teamName,
      });
      renderBuzzJoinApp();
    };
    return;
  }

  // Step 3: buzz button
  const lead = buzz.queue[0];
  const myPos = buzz.queue.findIndex(q => q.id === buzz.myId);
  const canBuzz = buzz.armed && myPos === -1;
  let status = 'Wait';
  if (canBuzz) status = 'Buzz in!';
  else if (myPos === 0) status = "You're up";
  else if (myPos > 0) status = `#${myPos + 1}`;
  else if (lead) status = `${lead.name} locked`;

  root.innerHTML = `
    <h2 style="text-align:center;color:var(--gold);">${escapeHtml(buzz.name)}</h2>
    <div class="hint" style="text-align:center;">${escapeHtml(buzz.teamName || '')} · ${escapeHtml(buzz.code)}</div>
    <div class="who-line" style="text-align:center;font-size:1.2rem;margin-top:12px;">${escapeHtml(status)}</div>
    <button class="buzz-btn ${canBuzz ? 'armed-pulse' : ''} ${!canBuzz ? 'locked-out' : ''}"
      id="buzzTap" ${canBuzz ? '' : 'disabled'}>BUZZ</button>`;
  const btn = document.getElementById('buzzTap');
  if (btn && canBuzz) {
    btn.onclick = () => buzzSend({ type: 'buzz' });
  }
}

/* ============================================================
   BOOT
============================================================ */
// iOS won't make a peep until a real tap.
document.addEventListener('touchstart', function unlockAudioOnce() {
  try { getAudioCtx(); } catch (e) {}
  document.removeEventListener('touchstart', unlockAudioOnce, true);
}, true);

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const ov = document.getElementById('overlay');
  if (!ov) return;
  if (e.code === 'Space') {
    const reveal = document.getElementById('revealBtn')
      || document.getElementById('revealDDBtn')
      || document.getElementById('revealF')
      || document.getElementById('sReveal')
      || document.getElementById('wildGoBtn');
    if (reveal) { e.preventDefault(); reveal.click(); }
    return;
  }
  if (e.key >= '1' && e.key <= '9') {
    const btns = [...ov.querySelectorAll('[data-prefix="award"], [data-prefix="chalaward"], [data-prefix="bq"]')];
    const i = parseInt(e.key, 10) - 1;
    if (btns[i]) { e.preventDefault(); btns[i].click(); }
    return;
  }
  if (e.key === '0') {
    const none = document.getElementById('noneBtn')
      || document.getElementById('chalNoneBtn')
      || document.getElementById('bqNone');
    if (none) { e.preventDefault(); none.click(); }
  }
});

(function boot() {
  normalizeRounds();
  const join = getJoinCode();
  if (join) {
    renderBuzzJoin();
    return;
  }
  const saved = loadSavedGame();
  if (saved && saved.state) {
    // Keep the saved game around but land on setup so the host chooses.
    state.spice = saved.state.spice || 'family';
  }
  hydrateWeekendDecks();
  render();
})();
</script>
