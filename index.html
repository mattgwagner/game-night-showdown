<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Night Showdown</title>
<style>
  :root {
    --navy: #04125c;
    --navy-deep: #020a38;
    --gold: #f5c518;
    --gold-dim: #b5901a;
    --green: #2ecc71;
    --red: #e74c3c;
    --purple: #8e44ad;
    --text: #f5f7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at top, var(--navy) 0%, var(--navy-deep) 70%);
    color: var(--text);
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Scoreboard ---------- */
  #scoreboard {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 10px 14px; background: rgba(0,0,0,0.35);
    border-bottom: 3px solid var(--gold);
  }
  .score-chip {
    background: rgba(255,255,255,0.06);
    border: 2px solid var(--gold-dim);
    border-radius: 10px;
    padding: 6px 14px;
    min-width: 110px;
    text-align: center;
    transition: transform .2s, box-shadow .2s;
  }
  .score-chip.leader {
    border-color: var(--gold);
    box-shadow: 0 0 14px rgba(245,197,24,.7);
    transform: scale(1.05);
  }
  .score-chip .name { font-weight: bold; font-size: 0.95rem; letter-spacing: .5px; }
  .score-chip .pts { font-size: 1.4rem; font-weight: 900; color: var(--gold); }

  h1.title {
    text-align: center; margin: 14px 0 4px;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(245,197,24,.6);
    color: var(--gold);
  }
  .subtitle { text-align: center; opacity: .7; margin-bottom: 10px; font-size: .95rem; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 30px; }

  /* ---------- Setup Screen ---------- */
  .panel {
    background: rgba(255,255,255,0.05);
    border: 2px solid var(--gold-dim);
    border-radius: 16px;
    padding: 24px;
    max-width: 560px;
    width: 100%;
    margin-top: 20px;
  }
  .panel h2 { margin-top: 0; color: var(--gold); text-align: center; }
  .team-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .team-row input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: none;
    font-size: 1rem; background: rgba(255,255,255,0.9); color: #111;
  }
  #teamList { margin: 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .team-entry {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 8px;
  }
  button {
    cursor: pointer; border: none; border-radius: 8px;
    font-family: inherit; font-weight: bold;
    transition: transform .1s, filter .1s;
  }
  button:active { transform: scale(0.96); }
  .btn-primary { background: var(--gold); color: #1a1400; padding: 12px 20px; font-size: 1.05rem; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: rgba(255,255,255,0.15); color: var(--text); padding: 10px 16px; }
  .btn-danger { background: var(--red); color: white; padding: 6px 12px; font-size: .85rem; }
  .btn-full { width: 100%; margin-top: 10px; padding: 14px; font-size: 1.1rem; }
  .btn-full:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: .85rem; opacity: .65; text-align: center; margin-top: 8px; }

  /* ---------- Board ---------- */
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 1400px;
  }
  .cat-header {
    background: linear-gradient(180deg, #0b1f8a, #04125c);
    border: 2px solid var(--gold-dim);
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
    font-weight: 900;
    font-size: clamp(0.65rem, 1.1vw, 0.95rem);
    letter-spacing: .5px;
    display: flex; align-items: center; justify-content: center;
    min-height: 64px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .cell {
    background: linear-gradient(180deg, #0b1f8a, #081770);
    border: 2px solid var(--gold-dim);
    border-radius: 8px;
    min-height: 64px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.1rem, 2.2vw, 1.6rem);
    font-weight: 900;
    color: var(--gold);
    transition: transform .12s, box-shadow .12s;
  }
  .cell.clickable:hover {
    transform: scale(1.04);
    box-shadow: 0 0 16px rgba(245,197,24,.55);
    cursor: pointer;
  }
  .cell.used { background: rgba(255,255,255,0.03); color: transparent; border-color: rgba(255,255,255,0.08); }
  .cell.wildcard-hidden::after { content: ''; }

  #boardControls { margin-top: 16px; display: flex; gap: 10px; }

  .reader-banner {
    background: rgba(245,197,24,0.12);
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: 8px 22px;
    margin-bottom: 14px;
    text-align: center;
    font-size: clamp(0.9rem, 1.6vw, 1.1rem);
  }
  .reader-banner strong { color: var(--gold); }

  /* ---------- Overlay (question / wildcard) ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .card {
    background: linear-gradient(180deg, #0d1f8f, #040d54);
    border: 3px solid var(--gold);
    border-radius: 18px;
    padding: 34px 30px;
    max-width: 760px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 50px rgba(245,197,24,.35);
    max-height: 88vh;
    overflow-y: auto;
  }
  .card .tag {
    display: inline-block; background: var(--gold); color: #1a1400;
    padding: 4px 14px; border-radius: 999px; font-weight: 900; font-size: .85rem;
    letter-spacing: 1px; margin-bottom: 14px; text-transform: uppercase;
  }
  .card .tag.wild { background: var(--purple); color: white; }
  .card .tag.dd { background: var(--red); color: white; animation: pulse .5s infinite alternate; }
  .superlatives { margin: 18px 0; text-align: left; }
  .superlative-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 8px 14px; margin-bottom: 8px; }
  .superlative-row .label { font-size: .9rem; opacity: .85; }
  .superlative-row .winner { font-weight: 900; color: var(--gold); }
  .card .catval { opacity: .75; margin-bottom: 6px; font-size: .95rem; letter-spacing: 1px; text-transform: uppercase; }
  .card .qtext { font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 700; margin: 14px 0 22px; line-height: 1.4; }
  .card .atext {
    font-size: clamp(1.1rem, 2.6vw, 1.4rem); color: var(--gold); font-weight: 900;
    margin: 10px 0 24px; padding-top: 16px; border-top: 2px dashed rgba(255,255,255,.2);
  }
  .team-btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-top: 10px; }
  .team-btn { padding: 12px 8px; background: rgba(255,255,255,0.1); color: var(--text); border: 2px solid var(--gold-dim); border-radius: 10px; font-size: 1rem; }
  .team-btn:hover { background: var(--green); color: #05330f; border-color: var(--green); }
  .none-btn { margin-top: 14px; }
  .wild-desc { font-size: 1.1rem; margin: 16px 0; min-height: 60px; display:flex; align-items:center; justify-content:center; }
  .spin-text { font-size: 1.6rem; font-weight: 900; color: var(--gold); animation: pulse .3s infinite alternate; }
  @keyframes pulse { from { opacity: .5; } to { opacity: 1; } }
  .row-gap { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px; }

  /* ---------- Winner screen ---------- */
  .winner-name { font-size: clamp(2rem,6vw,3.4rem); color: var(--gold); text-shadow: 0 0 24px rgba(245,197,24,.8); margin: 10px 0; }
  .medal { font-size: 3rem; }
  #confettiWrap { position: fixed; inset:0; pointer-events:none; overflow:hidden; z-index: 5; }
  .confetti { position:absolute; top:-10px; width:10px; height:16px; opacity:.9; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

  footer { text-align:center; opacity:.4; font-size:.75rem; padding: 10px; }
  /* ---------- Live-action squares ---------- */
  .who-line {
    opacity: .85; font-size: .95rem; line-height: 1.5;
    margin: 10px 0; max-width: 620px; margin-left: auto; margin-right: auto;
  }
  .card .qtext.task {
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    line-height: 1.45; font-weight: 600;
  }
  .judge-row { margin-top: 18px; }
  .vote-grid { grid-template-columns: 1fr 1fr; }
  .vote-opt { font-size: 1.05rem; padding: 18px 12px; }
  .btn-score {
    display: block; font-size: 1.25rem; font-weight: 900;
    color: var(--gold); margin-top: 3px; font-variant-numeric: tabular-nums;
  }
  .team-btn.awarded .btn-score { color: var(--green); }
  .team-btn.awarded {
    background: rgba(46,204,113,.25);
    border-color: var(--green);
    color: var(--green);
  }

  /* ---------- Countdown timer ---------- */
  .timer-wrap { margin: 18px auto; max-width: 380px; }
  .timer-num {
    font-size: 3.2rem; font-weight: 900; color: var(--gold);
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .timer-num.urgent { color: var(--red); animation: pulse .4s infinite alternate; }
  .timer-num.done { color: var(--red); font-size: 2.2rem; letter-spacing: 3px; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  .timer-track {
    height: 10px; background: rgba(255,255,255,.12);
    border-radius: 6px; overflow: hidden; margin: 10px 0;
  }
  .timer-fill { height: 100%; background: var(--gold); transition: width 1s linear; }
  .timer-btn { margin-top: 4px; }

  /* ---------- Score editor ---------- */
  .edit-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .edit-name { flex: 1; text-align: left; font-weight: bold; }
  .edit-score {
    min-width: 70px; font-weight: 900; color: var(--gold);
    font-size: 1.15rem; font-variant-numeric: tabular-nums;
  }
  .edit-btn { padding: 6px 12px; font-size: .9rem; }

  /* ---------- Weekend tournament ---------- */
  .weekend-box {
    margin-top: 18px; padding: 14px 16px;
    background: rgba(245,197,24,.07);
    border: 2px solid var(--gold-dim); border-radius: 12px;
  }
  .weekend-title {
    color: var(--gold); font-weight: 900; text-align: center;
    margin-bottom: 10px; letter-spacing: .5px;
  }

  /* ---------- Setup extras ---------- */
  .spice-toggle { display: flex; gap: 10px; margin: 4px 0 14px; }
  .spice-opt {
    flex: 1; padding: 12px 10px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--gold-dim); background: rgba(255,255,255,.04);
    color: var(--text); font-family: inherit; font-size: .9rem; text-align: center;
    transition: all .15s;
  }
  .spice-opt .st-name { font-weight: 900; display: block; }
  .spice-opt .st-desc { opacity: .65; font-size: .78rem; display: block; margin-top: 3px; }
  .spice-opt.on {
    background: rgba(245,197,24,.16); border-color: var(--gold);
    box-shadow: 0 0 12px rgba(245,197,24,.35);
  }
  .drinks-opt { text-align: center; }
  .size-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .size-row .spice-opt { flex: 1; }
  .mode-btn { text-align: left; padding: 14px 16px; }
  .lightning-count {
    color: var(--gold); font-weight: 900; letter-spacing: 1px;
    margin: 6px 0 10px; font-size: .95rem;
  }
  .potato-cat {
    font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 900; color: var(--gold);
    margin: 10px 0; letter-spacing: 1px;
  }
  .sober-note {
    margin: 12px auto 0; max-width: 560px; padding: 8px 12px;
    border-left: 3px solid var(--green); background: rgba(46,204,113,.09);
    border-radius: 0 8px 8px 0; font-size: .85rem; opacity: .9; text-align: left;
  }
  .resume-box {
    border: 2px solid var(--green); border-radius: 12px;
    padding: 14px; margin-bottom: 16px; background: rgba(46,204,113,.08);
  }

  /* ---------- Board host bar ---------- */
  .host-bar {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 10px;
  }
  .host-bar button { padding: 8px 14px; font-size: .85rem; }
  .gauntlet-badge {
    display: inline-block; font-size: .7rem; font-weight: 900;
    background: var(--purple); color: #fff; border-radius: 5px;
    padding: 2px 7px; margin-left: 8px; vertical-align: middle;
    letter-spacing: 1px;
  }
</style>
</head>

// Weighted draw so the live-action events dominate the deck.
function drawWildcardEvent() {
  const pool = [];
  WILDCARD_EVENTS.filter(spiceOk).forEach(e => {
    for (let i = 0; i < (e.weight || 1); i++) pool.push(e);
  });
  return pool[Math.floor(Math.random() * pool.length)];
}

function getLeader(state, excludeTeam) {
  const others = state.teams.filter(t => t !== excludeTeam);
  if (others.length === 0) return null;
  return others.reduce((a, b) => (b.score > a.score ? b : a));
}

/* ============================================================
   SOUND ENGINE (Web Audio API — no audio files needed)
============================================================ */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, startTime, duration, opts = {}) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = opts.type || 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  if (opts.slideTo) osc.frequency.linearRampToValueAtTime(opts.slideTo, startTime + duration);
  const peak = opts.volume !== undefined ? opts.volume : 0.2;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(peak, startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

function playCorrect() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(523.25, t0, 0.12, { type: 'triangle' });
  tone(659.25, t0 + 0.1, 0.12, { type: 'triangle' });
  tone(783.99, t0 + 0.2, 0.22, { type: 'triangle' });
}

function playWrong() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(180, t0, 0.28, { type: 'sawtooth', slideTo: 90, volume: 0.18 });
}

function playWildcardSpin() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  for (let i = 0; i < 6; i++) {
    tone(300 + i * 60, t0 + i * 0.09, 0.08, { type: 'square', volume: 0.1 });
  }
}

function playWildcardReveal() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(392, t0, 0.15, { type: 'sawtooth', volume: 0.15 });
  tone(523.25, t0 + 0.13, 0.15, { type: 'sawtooth', volume: 0.15 });
  tone(659.25, t0 + 0.26, 0.3, { type: 'sawtooth', volume: 0.18 });
}

function playDailyDouble() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(220, t0, 0.5, { type: 'sawtooth', slideTo: 440, volume: 0.2 });
  tone(220, t0 + 0.5, 0.5, { type: 'sawtooth', slideTo: 880, volume: 0.22 });
}

/* ============================================================
   STATE
============================================================ */
function freshState() {
  return {
    teams: [],          // { id, name, score, wildcardGain, biggestSwing, maxStreak, currentStreak, challengesWon, shield }
    used: {},           // "Category|Value" -> true
    screen: "setup",    // setup | roundselect | board | winner
    roundIndex: 0,
    readerIndex: 0,     // whose turn it is to pick & read
    lastCorrectTeamId: null,
    spice: "family",    // family | party
    drinks: false,      // drinking games are their own opt-in, separate from spice
    boardSize: 6,       // how many of a round's categories actually go on the board
    activeCategories: null, // this game's slice of them
    dd: null,           // this game's Daily Double square
    modeState: null,    // non-Jeopardy game in progress
    drawn: {},          // deckName -> indices already used this game
    history: [],        // undo snapshots
    finalDone: false,
    finalWagers: {}
  };
}

let state = freshState();

// Normalize every board at load. The rule is simply: any square that has no
// question IS a wildcard. That means wildcardSlots never has to be maintained by
// hand — add a question and the square becomes trivia, delete one and it becomes a
// wildcard. A Daily Double that lands on a wildcard gets moved to a real question.
function normalizeRounds() {
  ROUNDS.forEach(r => {
    if (r.type === 'gauntlet') return;
    r.questions = r.questions || {};
    r.wildValues = {};
    r.categories.forEach(cat => {
      const qs = r.questions[cat] || (r.questions[cat] = {});
      r.wildValues[cat] = VALUES.filter(v => qs[v] === undefined);
      // A fully-populated category still needs one surprise on it.
      if (r.wildValues[cat].length === 0) {
        const declared = r.wildcardSlots && r.wildcardSlots[cat];
        const pick = VALUES.indexOf(declared) !== -1 ? declared : VALUES[VALUES.length - 1];
        delete qs[pick];
        r.wildValues[cat] = [pick];
      }
    });
    const dd = r.dailyDouble;
    if (!dd) return;
    const qs = r.questions[dd.category];
    if (!qs || r.categories.indexOf(dd.category) === -1) { delete r.dailyDouble; return; }
    if (qs[dd.value] === undefined) {
      // It landed on a wildcard — slide it to the richest real question here.
      const real = VALUES.filter(v => qs[v] !== undefined);
      if (real.length) dd.value = real[real.length - 1];
      else delete r.dailyDouble;
    }
  });
}

function isWildSquare(round, cat, val) {
  return !!(round.wildValues && round.wildValues[cat] && round.wildValues[cat].indexOf(val) !== -1);
}

function currentRound() {
  return ROUNDS[state.roundIndex];
}

// A round carries 8 categories but only `boardSize` of them go up. Picking a
// fresh slice each time keeps games short AND means the same round plays
// differently every night.
function activeCats() {
  const r = currentRound();
  if (!r) return [];
  if (!state.activeCategories || !state.activeCategories.length) return r.categories;
  return state.activeCategories.filter(c => r.categories.indexOf(c) !== -1);
}

function startRound(roundIndex) {
  state.roundIndex = roundIndex;
  const r = ROUNDS[roundIndex];
  const n = Math.min(state.boardSize || 6, r.categories.length);
  state.activeCategories = shuffle(r.categories).slice(0, n);
  state.used = {};
  state.readerIndex = 0;
  state.lastCorrectTeamId = null;
  state.history = [];
  state.finalDone = false;
  state.modeState = null;
  // Daily Double has to land on a real question that's actually on this board.
  state.dd = null;
  if (r.type !== 'gauntlet') {
    const opts = [];
    state.activeCategories.forEach(c => VALUES.forEach(v => {
      if (r.questions[c] && r.questions[c][v] !== undefined) opts.push({ category: c, value: v });
    }));
    if (opts.length) state.dd = opts[Math.floor(Math.random() * opts.length)];
  }
  state.screen = 'board';
}

function totalCellsForRound() {
  return activeCats().length * VALUES.length;
}

function currentReader() {
  if (state.teams.length === 0) return null;
  return state.teams[state.readerIndex % state.teams.length];
}

function advanceReader() {
  if (state.teams.length === 0) return;
  state.readerIndex = (state.readerIndex + 1) % state.teams.length;
}
let nextTeamId = 1;

function resetTeamStats(team) {
  team.score = 0;
  team.wildcardGain = 0;
  team.biggestSwing = 0;
  team.maxStreak = 0;
  team.currentStreak = 0;
}

// Records a scoring event on a team and updates streak/wildcard/swing stats
// used for the end-of-game superlatives. opts: { isAnswer, isWildcard }
function scoreEvent(team, delta, opts = {}) {
  // An Insurance Policy eats exactly one negative swing, then burns out.
  if (delta < 0 && team.shield) {
    team.shield = false;
    delta = 0;
  }
  team.score += delta;
  if (delta > (team.biggestSwing || 0)) team.biggestSwing = delta;
  if (opts.isWildcard) team.wildcardGain = (team.wildcardGain || 0) + delta;
  if (opts.isChallenge && delta > 0) team.challengesWon = (team.challengesWon || 0) + 1;
  if (opts.isAnswer && delta > 0) {
    if (state.lastCorrectTeamId === team.id) team.currentStreak = (team.currentStreak || 0) + 1;
    else team.currentStreak = 1;
    state.lastCorrectTeamId = team.id;
    team.maxStreak = Math.max(team.maxStreak || 0, team.currentStreak);
  }
}

  else if (state.screen === 'roundselect') renderRoundSelect();
  else if (state.screen === 'board') renderBoard();
  else if (state.screen === 'mode') renderMode();
  else if (state.screen === 'winner') renderWinner();
  saveGame();
}

  if (state.screen === 'setup' || state.teams.length === 0) {
    $scoreboard.style.display = 'none';
    return;

  $scoreboard.style.display = 'flex';
  const maxScore = Math.max(...state.teams.map(t => t.score));
  $scoreboard.innerHTML = state.teams.map(t => `
    <div class="score-chip ${t.score === maxScore && maxScore > 0 ? 'leader' : ''}">
      <div class="name">${escapeHtml(t.name)}</div>
      <div class="pts">${t.score}</div>
    </div>
  `).join('');
}

/* ---------- Board screen ---------- */
function renderBoard() {
  const round = currentRound();
  const usedCount = Object.keys(state.used).length;
  const totalCells = totalCellsForRound();

  // Board cleared — go to the Final Showdown before crowning anyone.
  if (usedCount === totalCells && totalCells > 0) {
    if (!state.finalDone && state.teams.length > 0) { startFinalShowdown(); return; }
    state.screen = 'winner';
    render();

  }

  const cols = activeCats();
  const cats = cols.map(c => `<div class="cat-header">${escapeHtml(c)}</div>`).join('');
  const rows = VALUES.map(v => {
    return cols.map(cat => {
      const key = cat + '|' + v;

      return `<div class="cell ${isUsed ? 'used' : 'clickable'}" data-cat="${escapeHtml(cat)}" data-val="${v}">${label}</div>`;
    }).join('');

      <button class="btn-secondary" id="changeRoundBtn">Change Round</button>
      <button class="btn-secondary" id="resetBtn">Reset Game</button>
      <span class="hint" style="align-self:center;">${usedCount} / ${totalCells} squares revealed</span>

/* ---------- Question / Wildcard overlay ---------- */
function openSquare(cat, val) {
  pushHistory();
  const round = currentRound();

  // Gauntlet boards have no trivia at all — every square draws live.
  if (round.type === 'gauntlet') {
    const spec = round.deckFor[cat];
    const team = currentReader();
    openOverlayCard();
    const ctx = { cat, val, team, done: () => markUsedAndReturn(cat, val) };
    if (spec.deck === 'duel') runDuel(ctx);
    else if (spec.deck === 'vote') runVote(ctx);
    else runChallenge(ctx, spec.type);
    return;
  }

  const dd = state.dd;
  if (dd && dd.category === cat && dd.value === val) { openDailyDouble(cat, val); return; }
  if (isWildSquare(round, cat, val)) openWildcard(cat, val);
  else openQuestion(cat, val);
}

function closeOverlay() {
  const ov = document.getElementById('overlay');
  if (ov) ov.remove();
}

function markUsedAndReturn(cat, val) {
  state.used[cat + '|' + val] = true;
  advanceReader();
  closeOverlay();
  render();
}

/* ---------- Superlatives (end-of-game awards) ---------- */
function computeSuperlatives() {
  const teams = state.teams;
  const awards = [];
  if (teams.length === 0) return awards;

  const byBiggestSwing = [...teams].sort((a, b) => (b.biggestSwing || 0) - (a.biggestSwing || 0))[0];
  if (byBiggestSwing && byBiggestSwing.biggestSwing > 0) {
    awards.push({ label: '💥 Comeback Kid (biggest single swing)', team: byBiggestSwing, detail: `+${byBiggestSwing.biggestSwing} in one shot` });
  }

  const byWildcard = [...teams].sort((a, b) => (b.wildcardGain || 0) - (a.wildcardGain || 0))[0];
  if (byWildcard && (byWildcard.wildcardGain || 0) > 0) {
    awards.push({ label: '🍀 Wildcard Whisperer (luckiest on the unmarked squares)', team: byWildcard, detail: `net +${byWildcard.wildcardGain} from wildcards` });
  }

  const byStreak = [...teams].sort((a, b) => (b.maxStreak || 0) - (a.maxStreak || 0))[0];
  if (byStreak && (byStreak.maxStreak || 0) >= 2) {
    awards.push({ label: '🧊 Ice in Their Veins (longest correct streak)', team: byStreak, detail: `${byStreak.maxStreak} correct in a row` });
  }

  const byChallenge = [...teams].sort((a, b) => (b.challengesWon || 0) - (a.challengesWon || 0))[0];
  if (byChallenge && (byChallenge.challengesWon || 0) > 0) {
    awards.push({ label: '💪 Did The Thing (most challenges completed)', team: byChallenge, detail: `${byChallenge.challengesWon} challenge${byChallenge.challengesWon === 1 ? '' : 's'} survived` });
  }

  const sorted = [...teams].sort((a, b) => b.score - a.score);
  if (sorted.length > 1) {
    const last = sorted[sorted.length - 1];
    awards.push({ label: '🪑 Gracious in Defeat (last place, still showed up)', team: last, detail: `${last.score} points and a lot of heart` });
  }

  return awards;
}

/* ============================================================
   DECK DRAWING
   Every live-action deck is filtered by the current spice level
   and drawn without repeats until the deck is exhausted, so you
   don't get the same dare twice in one night.
============================================================ */
// Two independent gates. Spice is about how revealing the content is; drinks is
// about whether the room is drinking at all. A room with somebody sober, pregnant
// or driving should still get the full After Dark deck.
function spiceOk(item) {
  if (item.spice === 'party' && state.spice !== 'party') return false;
  if (item.drinks && !state.drinks) return false;
  return true;
}

function drawFrom(pool, deckName, filterFn) {
  if (!state.drawn) state.drawn = {};
  const used = state.drawn[deckName] || (state.drawn[deckName] = []);
  let candidates = pool
    .map((it, i) => ({ it, i }))
    .filter(x => spiceOk(x.it) && (!filterFn || filterFn(x.it)));
  if (candidates.length === 0) {
    // Spice filter emptied the deck — fall back to the unfiltered pool.
    candidates = pool.map((it, i) => ({ it, i })).filter(x => !filterFn || filterFn(x.it));
  }
  let fresh = candidates.filter(x => used.indexOf(x.i) === -1);
  if (fresh.length === 0) { // deck exhausted, reshuffle
    state.drawn[deckName] = [];
    fresh = candidates;
  }
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  state.drawn[deckName].push(pick.i);
  return pick.it;
}

let activeTimer = null;

function wireTimer(seconds) {
  const btn = document.getElementById('timerStartBtn');
  if (!btn) return;
  btn.onclick = () => {
    btn.remove();
    let left = seconds;
    const $num = document.getElementById('timerNum');
    const $fill = document.getElementById('timerFill');
    stopTimer();
    activeTimer = setInterval(() => {
      left--;
      if ($num) $num.textContent = left;
      if ($fill) $fill.style.width = (left / seconds * 100) + '%';
      if (left <= 5 && left > 0) { playTick(); if ($num) $num.classList.add('urgent'); }
      if (left <= 0) {
        stopTimer();
        playBuzzer();
        if ($num) { $num.textContent = "TIME"; $num.classList.add('done'); }
      }
    }, 1000);
  };
}

/* ============================================================
   LIVE-ACTION RUNNERS
   Each takes the square context and owns the overlay card until
   it calls done(), which marks the square used and returns to
   the board.
============================================================ */

// Shared scoring footer: award the points, or don't.
function judgeHtml(val, yesLabel, noLabel) {
  return `
    <div class="row-gap judge-row">
      <button class="btn-primary" id="passBtn">${yesLabel} (+${val})</button>
      <button class="btn-secondary" id="failBtn">${noLabel}</button>

  `;
}

function wireJudge(team, val, done, opts = {}) {
  document.getElementById('passBtn').onclick = () => {
    scoreEvent(team, val, { isAnswer: true, isChallenge: true });
    playCorrect();
    done();
  };
  document.getElementById('failBtn').onclick = () => {
    if (opts.penalty) scoreEvent(team, -opts.penalty, { isChallenge: true });
    playWrong();
    done();
  };
}

function whoLabel(who, team) {
  if (who === 'room') return 'EVERYBODY PLAYS — the winner scores for their team';
  if (who === 'team') return `${team.name} — as a team`;
  return `${team.name} — pick one person`;
}

function runChallenge(ctx, filterType) {
  const { val, team, done } = ctx;
  const types = filterType ? [].concat(filterType) : null;
  const ch = drawFrom(CHALLENGES, 'challenge', types ? (c => types.indexOf(c.type) !== -1) : null);
  const card = document.querySelector('#overlay .card');
  card.innerHTML = `
    <div class="tag wild">${ch.type === 'drink' ? '🍺' : '🔥'} ${escapeHtml(ch.t)}</div>
    <div class="who-line">${escapeHtml(whoLabel(ch.who, team))}</div>
    <div class="qtext task">${escapeHtml(ch.d)}</div>
    ${ch.drinks ? '<div class="sober-note">Not drinking? Take the push-ups instead — five per sip. Nobody has to explain themselves.</div>' : ''}
    ${ch.timer ? timerHtml(ch.timer) : ''}
    ${judgeHtml(val, 'They Did It', 'They Choked')}
  `;
  if (ch.timer) wireTimer(ch.timer);
  wireJudge(team, val, done);
}

function runDuel(ctx) {
  const { val, team, done } = ctx;
  const card = document.querySelector('#overlay .card');
  const others = state.teams.filter(t => t !== team);
  if (others.length === 0) { runChallenge(ctx); return; }
  card.innerHTML = `
    <div class="tag wild">⚔️ DUEL</div>
    <div class="who-line">${escapeHtml(team.name)} — call out your challenger.</div>
    <div class="team-btn-grid">${others.map(t =>
      teamBtn(t, `data-rival="${t.id}"`)
    ).join('')}</div>
  `;
  card.querySelectorAll('[data-rival]').forEach(btn => {
    btn.onclick = () => {
      const rival = state.teams.find(t => t.id == btn.dataset.rival);
      const duel = drawFrom(DUELS, 'duel');
      card.innerHTML = `
        <div class="tag wild">⚔️ ${escapeHtml(duel.t)}</div>
        <div class="who-line">${escapeHtml(team.name)} vs ${escapeHtml(rival.name)} — winner takes ${val}, loser drops ${Math.round(val / 2)}.</div>
        <div class="qtext task">${escapeHtml(duel.d)}</div>
        ${duel.timer ? timerHtml(duel.timer) : ''}
        <div class="who-line" style="margin-top:14px;">Who won?</div>
        <div class="team-btn-grid">
          ${teamBtn(team, `data-win="${team.id}" data-lose="${rival.id}"`)}
          ${teamBtn(rival, `data-win="${rival.id}" data-lose="${team.id}"`)}
        </div>
        <button class="btn-secondary none-btn" id="drawBtn">Called It a Draw</button>
      `;
      if (duel.timer) wireTimer(duel.timer);
      card.querySelectorAll('[data-win]').forEach(b => {
        b.onclick = () => {
          const winner = state.teams.find(t => t.id == b.dataset.win);
          const loser = state.teams.find(t => t.id == b.dataset.lose);
          scoreEvent(winner, val, { isAnswer: true, isChallenge: true });
          scoreEvent(loser, -Math.round(val / 2), { isChallenge: true });
          playCorrect();
          done();
        };
      });
      document.getElementById('drawBtn').onclick = () => { playWrong(); done(); };
    };
  });
}

function runBonusQuestion(ctx, event) {

function runInstant(ctx, event) {
  const { val, team, done } = ctx;
  const card = document.querySelector('#overlay .card');
  const descText = event.describe(val, state, team);

  if (event.needsTarget) {
    const others = state.teams.filter(t => t !== team);
    card.innerHTML = `
      <div class="tag wild">${event.label}</div>
      <div class="wild-desc">${escapeHtml(descText)}</div>
      <div class="team-btn-grid">${others.map(t =>
        teamBtn(t, `data-target="${t.id}"`)
      ).join('')}</div>
    `;
    card.querySelectorAll('[data-target]').forEach(btn => {
      btn.onclick = () => {
        const targetTeam = state.teams.find(t => t.id == btn.dataset.target);
        const before = team.score;
        event.apply(state, team, val, targetTeam);
        team.wildcardGain = (team.wildcardGain || 0) + (team.score - before);
        team.biggestSwing = Math.max(team.biggestSwing || 0, team.score - before);
        done();
      };
    });
    return;
  }

  const scoreBefore = team.score;
  event.apply(state, team, val);
  const delta = team.score - scoreBefore;
  team.wildcardGain = (team.wildcardGain || 0) + delta;
  team.biggestSwing = Math.max(team.biggestSwing || 0, delta);
  card.innerHTML = `
    <div class="tag wild">${event.label}</div>
    <div class="wild-desc">${escapeHtml(descText)}</div>
    <button class="btn-primary" id="continueBtn">Continue</button>
  `;
  document.getElementById('continueBtn').onclick = done;
}

/* Dispatch a drawn wildcard event to its runner. */
function runEvent(event, ctx) {
  playWildcardReveal();
  if (event.kind === 'challenge') return runChallenge(ctx, ['physical', 'performance', 'speed', 'social', 'room']);
  if (event.kind === 'drink') return runChallenge(ctx, 'drink');
  if (event.kind === 'duel') return runDuel(ctx);
  if (event.kind === 'vote') return runVote(ctx);
  if (event.kind === 'bonusq') return runBonusQuestion(ctx, event);
  return runInstant(ctx, event);
}

/* ============================================================
   SAVE / RESUME
   Someone always closes the tab. This is a three-day weekend.
============================================================ */
const SAVE_KEY = 'gns.save.v1';
const WEEKEND_KEY = 'gns.weekend.v1';

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ state, nextTeamId }));
  } catch (e) { /* private browsing, quota, whatever — never break the game over it */ }
}

function loadSavedGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.state || !Array.isArray(data.state.teams)) return null;
    if (data.state.teams.length === 0) return null;
    if (data.state.screen === 'setup') return null;
    return data;
  } catch (e) { return null; }
}

function clearSavedGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function loadWeekend() {
  try {
    const raw = localStorage.getItem(WEEKEND_KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (!data || !Array.isArray(data.games)) return { games: [], totals: {} };
    return data;
  } catch (e) { return { games: [], totals: {} }; }
}

function saveWeekend(w) {
  try { localStorage.setItem(WEEKEND_KEY, JSON.stringify(w)); } catch (e) {}
}

// Fold a finished game's scores into the running weekend totals.
function bankGameToWeekend() {
  const w = loadWeekend();
  const sorted = [...state.teams].sort((a, b) => b.score - a.score);
  w.games.push({
    round: currentRound().name,
    when: new Date().toLocaleString(),
    results: sorted.map(t => ({ name: t.name, score: t.score }))
  });
  sorted.forEach((t, i) => {
    if (!w.totals[t.name]) w.totals[t.name] = { points: 0, wins: 0, games: 0 };
    w.totals[t.name].points += t.score;
    w.totals[t.name].games += 1;
    if (i === 0) w.totals[t.name].wins += 1;
  });
  saveWeekend(w);
  return w;
}

function weekendStandingsHtml() {
  const w = loadWeekend();
  const names = Object.keys(w.totals);
  if (names.length === 0) return '';
  const rows = names
    .map(n => ({ name: n, ...w.totals[n] }))
    .sort((a, b) => b.points - a.points);
  return `
    <div class="weekend-box">
      <div class="weekend-title">🏅 Weekend Standings — ${w.games.length} game${w.games.length === 1 ? '' : 's'} banked</div>
      ${rows.map((r, i) => `
        <div class="superlative-row">
          <span class="label">${i === 0 ? '👑 ' : (i + 1) + '. '}${escapeHtml(r.name)}</span>
          <span class="winner">${r.points} pts <span style="opacity:.6;font-weight:400;">(${r.wins} win${r.wins === 1 ? '' : 's'} / ${r.games})</span></span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ============================================================
   UNDO
   Snapshot before every square resolves. The host always
   mis-taps at least once a night.
============================================================ */
function pushHistory() {
  if (!state.history) state.history = [];
  state.history.push(JSON.stringify({
    teams: state.teams,
    used: state.used,
    readerIndex: state.readerIndex,
    lastCorrectTeamId: state.lastCorrectTeamId,
    drawn: state.drawn
  }));
  if (state.history.length > 25) state.history.shift();
}

function undoLast() {
  if (!state.history || state.history.length === 0) return false;
  const snap = JSON.parse(state.history.pop());
  state.teams = snap.teams;
  state.used = snap.used;
  state.readerIndex = snap.readerIndex;
  state.lastCorrectTeamId = snap.lastCorrectTeamId;
  state.drawn = snap.drawn;
  if (state.screen === 'winner') state.screen = 'board';
  return true;
}

/* ============================================================
   FINAL SHOWDOWN
   The board clearing used to just... end. Now it ends like this:
   category revealed, everybody wagers blind, one question, chaos.
============================================================ */
function startFinalShowdown() {
  const item = drawFrom(FINAL_SHOWDOWN, 'final');
  state.finalWagers = {};
  const eligible = state.teams.filter(t => t.score > 0);
  const players = eligible.length > 0 ? eligible : state.teams;
  let idx = 0;

  const overlay = document.createElement('div');
  overlay.id = 'overlay';
  document.body.appendChild(overlay);
  playDailyDouble();

  function wagerStep() {
    if (idx >= players.length) return questionStep();
    const t = players[idx];
    const max = Math.max(t.score, 0);
    overlay.innerHTML = `
      <div class="card">
        <div class="tag dd">🏁 THE FINAL SHOWDOWN 🏁</div>
        <div class="catval">Category: ${escapeHtml(item.cat)}</div>
        <div class="who-line"><strong>${escapeHtml(t.name)}</strong> — wager anything from 0 up to your whole score. Everybody else, look away. This is binding.</div>
        <div style="margin:16px 0;">
          <input type="number" id="fWager" min="0" max="${max}" value="${Math.min(500, max)}"
            style="width:160px;padding:12px;border-radius:8px;border:none;font-size:1.3rem;text-align:center;">
        </div>
        <div class="row-gap">
          <button class="btn-secondary" data-fw="0">Nothing</button>
          <button class="btn-secondary" data-fw="${Math.floor(max / 2)}">Half</button>
          <button class="btn-secondary" data-fw="${max}">EVERYTHING</button>
        </div>
        <button class="btn-primary btn-full" id="lockF" style="margin-top:16px;">Lock It In</button>
        <div class="hint" style="margin-top:8px;">${idx + 1} of ${players.length}</div>
      </div>
    `;
    const $w = document.getElementById('fWager');
    overlay.querySelectorAll('[data-fw]').forEach(b => { b.onclick = () => { $w.value = b.dataset.fw; }; });
    document.getElementById('lockF').onclick = () => {
      let w = parseInt($w.value, 10);
      if (isNaN(w) || w < 0) w = 0;
      if (w > max) w = max;
      state.finalWagers[t.id] = w;
      idx++;
      wagerStep();
    };
  }

  function questionStep() {
    overlay.innerHTML = `
      <div class="card">
        <div class="tag dd">🏁 ${escapeHtml(item.cat)} 🏁</div>
        <div class="qtext">${escapeHtml(item.q)}</div>
        <div class="who-line">Everybody writes their answer down. No shouting. When every pen is down, reveal.</div>
        ${timerHtml(60)}
        <button class="btn-primary btn-full" id="revealF" style="margin-top:14px;">Reveal the Answer</button>
      </div>
    `;
    wireTimer(60);
    document.getElementById('revealF').onclick = () => {
      stopTimer();
      overlay.innerHTML = `
        <div class="card">
          <div class="tag dd">🏁 THE ANSWER 🏁</div>
          <div class="atext">${escapeHtml(item.a)}</div>
          <div class="who-line">Tap each team that got it. Tap again to flip them back.</div>
          <div id="finalJudge"></div>
          <button class="btn-primary btn-full" id="finishF" style="margin-top:16px;">Settle Up</button>
        </div>
      `;
      const verdict = {};
      function drawJudge() {
        document.getElementById('finalJudge').innerHTML = players.map(t => `
          <div class="edit-row">
            <span class="edit-name">${escapeHtml(t.name)}</span>
            <span class="edit-score">${verdict[t.id] ? '+' : '−'}${state.finalWagers[t.id]}</span>
            <button class="btn-secondary edit-btn ${verdict[t.id] ? 'awarded' : ''}" data-fj="${t.id}">
              ${verdict[t.id] ? 'Correct ✓' : 'Wrong ✗'}
            </button>
          </div>
        `).join('');
        document.querySelectorAll('[data-fj]').forEach(b => {
          b.onclick = () => { verdict[b.dataset.fj] = !verdict[b.dataset.fj]; drawJudge(); };
        });
      }
      drawJudge();
      document.getElementById('finishF').onclick = () => {
        players.forEach(t => {
          const w = state.finalWagers[t.id] || 0;
          if (verdict[t.id]) scoreEvent(t, w, { isAnswer: true });
          else scoreEvent(t, -w, {});
        });
        state.finalDone = true;
        closeOverlay();
        playFanfare();
        state.screen = 'winner';
        render();
      };
    };
  }

  wagerStep();
}

/* ============================================================
   GAME MODES — the non-Jeopardy formats
   Each one keeps everything it needs in state.modeState so it
   survives a refresh, and each render is a pure function of that.
============================================================ */
const MODES = [
  {
    key: "lightning",
    name: "Lightning Round",
    tagline: "Sixty seconds per team. Rapid fire. Pass costs you nothing but the clock.",
    icon: "⚡"
  },
  {
    key: "standing",
    name: "Last Team Standing",
    tagline: "One question each, around the room. Miss it and you're out. Survive alone and take 1000.",
    icon: "🎯"
  },
  {
    key: "potato",
    name: "Hot Potato",
    tagline: "One category, teams alternate naming things. Stall or repeat and you're eliminated.",
    icon: "🥔"
  }
];

let modeTimer = null;
function stopModeTimer() {
  if (modeTimer) { clearInterval(modeTimer); modeTimer = null; }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function aliveTeams() {
  const ms = state.modeState;
  return ms.alive.map(id => state.teams.find(t => t.id === id)).filter(Boolean);
}

function startMode(key) {
  stopModeTimer();
  const ids = state.teams.map(t => t.id);
  if (key === 'lightning') {
    state.modeState = { kind: 'lightning', order: ids, idx: 0, phase: 'ready', correct: {}, q: null, deadline: 0 };
  } else if (key === 'standing') {
    state.modeState = { kind: 'standing', alive: [...ids], idx: 0, phase: 'question', q: null, out: [] };
    state.modeState.q = drawFrom(BONUS_QUESTIONS, 'bonus');
  } else if (key === 'potato') {
    state.modeState = { kind: 'potato', alive: [...ids], idx: 0, prompt: LIST_PROMPTS[Math.floor(Math.random() * LIST_PROMPTS.length)], said: 0 };
  }
  state.screen = 'mode';
  render();
}

function exitMode() {
  stopModeTimer();
  state.modeState = null;
  state.screen = 'roundselect';
  render();
}

function renderMode() {
  stopModeTimer();
  const ms = state.modeState;
  if (!ms) { exitMode(); return; }
  if (ms.kind === 'lightning') return renderLightning();
  if (ms.kind === 'standing') return renderStanding();
  if (ms.kind === 'potato') return renderPotato();
  exitMode();
}

/* ---------- Lightning Round ---------- */
function renderLightning() {
  const ms = state.modeState;

  if (ms.phase === 'done') {
    const rows = ms.order.map(id => ({ t: state.teams.find(x => x.id === id), n: ms.correct[id] || 0 }))
      .filter(r => r.t).sort((a, b) => b.n - a.n);
    $main.innerHTML = `
      <h1 class="title">⚡ Lightning Round ⚡</h1>
      <div class="panel" style="text-align:center;">
        <h2>Final Tally</h2>
        ${rows.map((r, i) => `
          <div class="team-entry" style="margin-bottom:6px;">
            <span>${i === 0 ? '🏆 ' : ''}${escapeHtml(r.t.name)}</span>
            <span style="font-weight:900;color:var(--gold);">${r.n} correct · +${r.n * 100}</span>
          </div>`).join('')}
        <button class="btn-primary btn-full" id="lDone" style="margin-top:16px;">Back to the Board</button>
      </div>`;
    document.getElementById('lDone').onclick = exitMode;
    return;
  }

  const team = state.teams.find(t => t.id === ms.order[ms.idx]);
  if (!team) { ms.phase = 'done'; render(); return; }

  if (ms.phase === 'ready') {
    $main.innerHTML = `
      <h1 class="title">⚡ Lightning Round ⚡</h1>
      <div class="panel" style="text-align:center;">
        <div class="who-line">Team ${ms.idx + 1} of ${ms.order.length}</div>
        <div class="winner-name">${escapeHtml(team.name)}</div>
        <div class="who-line">
          Sixty seconds. The host reads, you shout. Every correct answer is 100 points.
          Pass as often as you like — the only thing you lose is clock.
        </div>
        <button class="btn-primary btn-full" id="lGo">Start the Clock</button>
        <button class="btn-secondary btn-full" id="lQuit">Quit Lightning Round</button>
      </div>`;
    document.getElementById('lGo').onclick = () => {
      ms.phase = 'playing';
      ms.deadline = Date.now() + 60000;
      ms.q = drawFrom(BONUS_QUESTIONS, 'bonus');
      render();
    };
    document.getElementById('lQuit').onclick = exitMode;
    return;
  }

  // playing
  const left = Math.max(0, Math.ceil((ms.deadline - Date.now()) / 1000));
  $main.innerHTML = `
    <h1 class="title" style="margin-bottom:0;">⚡ ${escapeHtml(team.name)} ⚡</h1>
    <div class="panel" style="text-align:center;">
      <div class="timer-num" id="lNum">${left}</div>
      <div class="timer-track"><div class="timer-fill" id="lFill" style="width:${left / 60 * 100}%"></div></div>
      <div class="lightning-count">${ms.correct[team.id] || 0} correct</div>
      <div class="qtext">${escapeHtml(ms.q.q)}</div>
      <div class="atext" style="opacity:.55;font-size:1rem;">${escapeHtml(ms.q.a)}</div>
      <div class="row-gap judge-row">
        <button class="btn-primary" id="lYes">✓ Got It</button>
        <button class="btn-secondary" id="lNo">Pass</button>
      </div>
    </div>`;

  const next = (scored) => {
    if (scored) {
      ms.correct[team.id] = (ms.correct[team.id] || 0) + 1;
      playCorrect();
    }
    ms.q = drawFrom(BONUS_QUESTIONS, 'bonus');
    render();
  };
  document.getElementById('lYes').onclick = () => next(true);
  document.getElementById('lNo').onclick = () => next(false);

  modeTimer = setInterval(() => {
    const rem = Math.max(0, Math.ceil((ms.deadline - Date.now()) / 1000));
    const $n = document.getElementById('lNum'), $f = document.getElementById('lFill');
    if ($n) { $n.textContent = rem; if (rem <= 5) $n.classList.add('urgent'); }
    if ($f) $f.style.width = (rem / 60 * 100) + '%';
    if (rem <= 5 && rem > 0) playTick();
    if (rem <= 0) {
      stopModeTimer();
      playBuzzer();
      const got = ms.correct[team.id] || 0;
      if (got > 0) scoreEvent(team, got * 100, { isAnswer: true });
      ms.idx++;
      ms.phase = ms.idx >= ms.order.length ? 'done' : 'ready';
      render();
    }
  }, 250);
}

/* ---------- Last Team Standing ---------- */
function renderStanding() {
  const ms = state.modeState;
  const alive = aliveTeams();

  if (alive.length <= 1) {
    const winner = alive[0];
    if (winner && !ms.paid) { scoreEvent(winner, 1000, { isAnswer: true }); ms.paid = true; playFanfare(); }
    $main.innerHTML = `
      <h1 class="title">🎯 Last Team Standing 🎯</h1>
      <div class="panel" style="text-align:center;">
        <div class="medal">🏆</div>
        <div class="winner-name">${winner ? escapeHtml(winner.name) : 'Nobody'}</div>
        <div class="who-line">${winner ? 'Survived the whole room. +1000.' : 'Everybody went out. Nobody gets paid.'}</div>
        <button class="btn-primary btn-full" id="sDone">Back to the Board</button>
      </div>`;
    document.getElementById('sDone').onclick = exitMode;
    return;
  }

  if (ms.idx >= ms.alive.length) ms.idx = 0;
  const team = state.teams.find(t => t.id === ms.alive[ms.idx]);

  $main.innerHTML = `
    <h1 class="title">🎯 Last Team Standing 🎯</h1>
    <div class="panel" style="text-align:center;">
      <div class="who-line">${alive.length} team${alive.length === 1 ? '' : 's'} still alive${ms.out.length ? ' · out: ' + ms.out.map(escapeHtml).join(', ') : ''}</div>
      <div class="winner-name" style="font-size:1.6rem;">${escapeHtml(team.name)}</div>
      <div class="qtext">${escapeHtml(ms.q.q)}</div>
      ${ms.phase === 'reveal' ? `
        <div class="atext">${escapeHtml(ms.q.a)}</div>
        <div class="row-gap judge-row">
          <button class="btn-primary" id="sRight">Survived</button>
          <button class="btn-secondary" id="sWrong">Eliminated</button>
        </div>` : `
        <button class="btn-primary btn-full" id="sReveal">Reveal Answer</button>`}
      <button class="btn-secondary btn-full" id="sQuit" style="margin-top:10px;">Quit This Mode</button>
    </div>`;

  document.getElementById('sQuit').onclick = exitMode;
  if (ms.phase === 'reveal') {
    document.getElementById('sRight').onclick = () => {
      playCorrect();
      ms.idx++;
      ms.phase = 'question';
      ms.q = drawFrom(BONUS_QUESTIONS, 'bonus');
      render();
    };
    document.getElementById('sWrong').onclick = () => {
      playWrong();
      ms.out.push(team.name);
      ms.alive = ms.alive.filter(id => id !== team.id);
      if (ms.idx >= ms.alive.length) ms.idx = 0;
      ms.phase = 'question';
      ms.q = drawFrom(BONUS_QUESTIONS, 'bonus');
      render();
    };
  } else {
    document.getElementById('sReveal').onclick = () => { ms.phase = 'reveal'; render(); };
  }
}

/* ---------- Hot Potato ---------- */
function renderPotato() {
  const ms = state.modeState;
  const alive = aliveTeams();

  if (alive.length <= 1) {
    const winner = alive[0];
    if (winner && !ms.paid) { scoreEvent(winner, 1000, { isAnswer: true }); ms.paid = true; playFanfare(); }
    $main.innerHTML = `
      <h1 class="title">🥔 Hot Potato 🥔</h1>
      <div class="panel" style="text-align:center;">
        <div class="medal">🏆</div>
        <div class="winner-name">${winner ? escapeHtml(winner.name) : 'Nobody'}</div>
        <div class="who-line">${ms.said} answers deep on <strong>${escapeHtml(ms.prompt)}</strong>${winner ? ' — and they were the last one standing. +1000.' : '.'}</div>
        <button class="btn-primary btn-full" id="pAgain">Another Category</button>
        <button class="btn-secondary btn-full" id="pDone">Back to the Board</button>
      </div>`;
    document.getElementById('pAgain').onclick = () => startMode('potato');
    document.getElementById('pDone').onclick = exitMode;
    return;
  }

  if (ms.idx >= ms.alive.length) ms.idx = 0;
  const team = state.teams.find(t => t.id === ms.alive[ms.idx]);

  $main.innerHTML = `
    <h1 class="title">🥔 Hot Potato 🥔</h1>
    <div class="panel" style="text-align:center;">
      <div class="who-line">Name something in this category. No repeats. Five seconds of silence and you're out.</div>
      <div class="potato-cat">${escapeHtml(ms.prompt)}</div>
      <div class="who-line">${ms.said} named so far · ${alive.length} teams alive</div>
      <div class="winner-name" style="font-size:1.7rem;">${escapeHtml(team.name)}</div>
      <div class="row-gap judge-row">
        <button class="btn-primary" id="pGot">✓ Named One</button>
        <button class="btn-secondary" id="pOut">Stalled — Out</button>
      </div>
      <button class="btn-secondary btn-full" id="pQuit" style="margin-top:10px;">Quit This Mode</button>
    </div>`;

  document.getElementById('pGot').onclick = () => {
    ms.said++;
    ms.idx++;
    playCorrect();
    render();
  };
  document.getElementById('pOut').onclick = () => {
    playWrong();
    ms.alive = ms.alive.filter(id => id !== team.id);
    if (ms.idx >= ms.alive.length) ms.idx = 0;
    render();
  };
  document.getElementById('pQuit').onclick = exitMode;
}

/* ============================================================
   BOOT
============================================================ */
(function boot() {
  normalizeRounds();
  const saved = loadSavedGame();
  if (saved && saved.state) {
    // Keep the saved game around but land on setup so the host chooses.
    state.spice = saved.state.spice || 'family';
  }
  render();
})();
</script>
</body>
</html>
