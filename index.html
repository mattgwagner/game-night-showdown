<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Night Showdown</title>
<style>
  :root {
    --navy: #04125c;
    --navy-deep: #020a38;
    --gold: #f5c518;
    --gold-dim: #b5901a;
    --green: #2ecc71;
    --red: #e74c3c;
    --purple: #8e44ad;
    --text: #f5f7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at top, var(--navy) 0%, var(--navy-deep) 70%);
    color: var(--text);
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Scoreboard ---------- */
  #scoreboard {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 10px 14px; background: rgba(0,0,0,0.35);
    border-bottom: 3px solid var(--gold);
  }
  .score-chip {
    background: rgba(255,255,255,0.06);
    border: 2px solid var(--gold-dim);
    border-radius: 10px;
    padding: 6px 14px;
    min-width: 110px;
    text-align: center;
    transition: transform .2s, box-shadow .2s;
  }
  .score-chip.leader {
    border-color: var(--gold);
    box-shadow: 0 0 14px rgba(245,197,24,.7);
    transform: scale(1.05);
  }
  .score-chip .name { font-weight: bold; font-size: 0.95rem; letter-spacing: .5px; }
  .score-chip .pts { font-size: 1.4rem; font-weight: 900; color: var(--gold); }

  h1.title {
    text-align: center; margin: 14px 0 4px;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(245,197,24,.6);
    color: var(--gold);
  }
  .subtitle { text-align: center; opacity: .7; margin-bottom: 10px; font-size: .95rem; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 30px; }

  /* ---------- Setup Screen ---------- */
  .panel {
    background: rgba(255,255,255,0.05);
    border: 2px solid var(--gold-dim);
    border-radius: 16px;
    padding: 24px;
    max-width: 560px;
    width: 100%;
    margin-top: 20px;
  }
  .panel h2 { margin-top: 0; color: var(--gold); text-align: center; }
  .team-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .team-row input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: none;
    font-size: 1rem; background: rgba(255,255,255,0.9); color: #111;
  }
  #teamList { margin: 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .team-entry {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 8px;
  }
  button {
    cursor: pointer; border: none; border-radius: 8px;
    font-family: inherit; font-weight: bold;
    transition: transform .1s, filter .1s;
  }
  button:active { transform: scale(0.96); }
  .btn-primary { background: var(--gold); color: #1a1400; padding: 12px 20px; font-size: 1.05rem; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: rgba(255,255,255,0.15); color: var(--text); padding: 10px 16px; }
  .btn-danger { background: var(--red); color: white; padding: 6px 12px; font-size: .85rem; }
  .btn-full { width: 100%; margin-top: 10px; padding: 14px; font-size: 1.1rem; }
  .btn-full:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: .85rem; opacity: .65; text-align: center; margin-top: 8px; }

  /* ---------- Board ---------- */
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 1400px;
  }
  .cat-header {
    background: linear-gradient(180deg, #0b1f8a, #04125c);
    border: 2px solid var(--gold-dim);
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
    font-weight: 900;
    font-size: clamp(0.65rem, 1.1vw, 0.95rem);
    letter-spacing: .5px;
    display: flex; align-items: center; justify-content: center;
    min-height: 64px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .cell {
    background: linear-gradient(180deg, #0b1f8a, #081770);
    border: 2px solid var(--gold-dim);
    border-radius: 8px;
    min-height: 64px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.1rem, 2.2vw, 1.6rem);
    font-weight: 900;
    color: var(--gold);
    transition: transform .12s, box-shadow .12s;
  }
  .cell.clickable:hover {
    transform: scale(1.04);
    box-shadow: 0 0 16px rgba(245,197,24,.55);
    cursor: pointer;
  }
  .cell.used { background: rgba(255,255,255,0.03); color: transparent; border-color: rgba(255,255,255,0.08); }
  .cell.wildcard-hidden::after { content: ''; }

  #boardControls { margin-top: 16px; display: flex; gap: 10px; }

  .reader-banner {
    background: rgba(245,197,24,0.12);
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: 8px 22px;
    margin-bottom: 14px;
    text-align: center;
    font-size: clamp(0.9rem, 1.6vw, 1.1rem);
  }
  .reader-banner strong { color: var(--gold); }

  /* ---------- Overlay (question / wildcard) ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .card {
    background: linear-gradient(180deg, #0d1f8f, #040d54);
    border: 3px solid var(--gold);
    border-radius: 18px;
    padding: 34px 30px;
    max-width: 760px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 50px rgba(245,197,24,.35);
    max-height: 88vh;
    overflow-y: auto;
  }
  .card .tag {
    display: inline-block; background: var(--gold); color: #1a1400;
    padding: 4px 14px; border-radius: 999px; font-weight: 900; font-size: .85rem;
    letter-spacing: 1px; margin-bottom: 14px; text-transform: uppercase;
  }
  .card .tag.wild { background: var(--purple); color: white; }
  .card .tag.dd { background: var(--red); color: white; animation: pulse .5s infinite alternate; }
  .superlatives { margin: 18px 0; text-align: left; }
  .superlative-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 8px 14px; margin-bottom: 8px; }
  .superlative-row .label { font-size: .9rem; opacity: .85; }
  .superlative-row .winner { font-weight: 900; color: var(--gold); }
  .card .catval { opacity: .75; margin-bottom: 6px; font-size: .95rem; letter-spacing: 1px; text-transform: uppercase; }
  .card .qtext { font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 700; margin: 14px 0 22px; line-height: 1.4; }
  .card .atext {
    font-size: clamp(1.1rem, 2.6vw, 1.4rem); color: var(--gold); font-weight: 900;
    margin: 10px 0 24px; padding-top: 16px; border-top: 2px dashed rgba(255,255,255,.2);
  }
  .team-btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-top: 10px; }
  .team-btn { padding: 12px 8px; background: rgba(255,255,255,0.1); color: var(--text); border: 2px solid var(--gold-dim); border-radius: 10px; font-size: 1rem; }
  .team-btn:hover { background: var(--green); color: #05330f; border-color: var(--green); }
  .none-btn { margin-top: 14px; }
  .wild-desc { font-size: 1.1rem; margin: 16px 0; min-height: 60px; display:flex; align-items:center; justify-content:center; }
  .spin-text { font-size: 1.6rem; font-weight: 900; color: var(--gold); animation: pulse .3s infinite alternate; }
  @keyframes pulse { from { opacity: .5; } to { opacity: 1; } }
  .row-gap { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px; }

  /* ---------- Winner screen ---------- */
  .winner-name { font-size: clamp(2rem,6vw,3.4rem); color: var(--gold); text-shadow: 0 0 24px rgba(245,197,24,.8); margin: 10px 0; }
  .medal { font-size: 3rem; }
  #confettiWrap { position: fixed; inset:0; pointer-events:none; overflow:hidden; z-index: 5; }
  .confetti { position:absolute; top:-10px; width:10px; height:16px; opacity:.9; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

  footer { text-align:center; opacity:.4; font-size:.75rem; padding: 10px; }
</style>
</head>

function getLeader(state, excludeTeam) {
  const others = state.teams.filter(t => t !== excludeTeam);
  if (others.length === 0) return null;
  return others.reduce((a, b) => (b.score > a.score ? b : a));
}

/* ============================================================
   SOUND ENGINE (Web Audio API — no audio files needed)
============================================================ */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, startTime, duration, opts = {}) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = opts.type || 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  if (opts.slideTo) osc.frequency.linearRampToValueAtTime(opts.slideTo, startTime + duration);
  const peak = opts.volume !== undefined ? opts.volume : 0.2;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(peak, startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

function playCorrect() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(523.25, t0, 0.12, { type: 'triangle' });
  tone(659.25, t0 + 0.1, 0.12, { type: 'triangle' });
  tone(783.99, t0 + 0.2, 0.22, { type: 'triangle' });
}

function playWrong() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(180, t0, 0.28, { type: 'sawtooth', slideTo: 90, volume: 0.18 });
}

function playWildcardSpin() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  for (let i = 0; i < 6; i++) {
    tone(300 + i * 60, t0 + i * 0.09, 0.08, { type: 'square', volume: 0.1 });
  }
}

function playWildcardReveal() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(392, t0, 0.15, { type: 'sawtooth', volume: 0.15 });
  tone(523.25, t0 + 0.13, 0.15, { type: 'sawtooth', volume: 0.15 });
  tone(659.25, t0 + 0.26, 0.3, { type: 'sawtooth', volume: 0.18 });
}

function playDailyDouble() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  tone(220, t0, 0.5, { type: 'sawtooth', slideTo: 440, volume: 0.2 });
  tone(220, t0 + 0.5, 0.5, { type: 'sawtooth', slideTo: 880, volume: 0.22 });
}

function currentRound() {
  return ROUNDS[state.roundIndex];
}

function totalCellsForRound() {
  return currentRound().categories.length * VALUES.length;
}

function currentReader() {
  if (state.teams.length === 0) return null;
  return state.teams[state.readerIndex % state.teams.length];
}

function advanceReader() {
  if (state.teams.length === 0) return;
  state.readerIndex = (state.readerIndex + 1) % state.teams.length;
}
let nextTeamId = 1;

function resetTeamStats(team) {
  team.score = 0;
  team.wildcardGain = 0;
  team.biggestSwing = 0;
  team.maxStreak = 0;
  team.currentStreak = 0;
}

// Records a scoring event on a team and updates streak/wildcard/swing stats
// used for the end-of-game superlatives. opts: { isAnswer, isWildcard }
function scoreEvent(team, delta, opts = {}) {
  team.score += delta;
  if (delta > (team.biggestSwing || 0)) team.biggestSwing = delta;
  if (opts.isWildcard) team.wildcardGain = (team.wildcardGain || 0) + delta;
  if (opts.isAnswer && delta > 0) {
    if (state.lastCorrectTeamId === team.id) team.currentStreak = (team.currentStreak || 0) + 1;
    else team.currentStreak = 1;
    state.lastCorrectTeamId = team.id;
    team.maxStreak = Math.max(team.maxStreak || 0, team.currentStreak);
  }
}

/* ============================================================
   RENDER HELPERS
============================================================ */
const $main = document.getElementById('main');
const $scoreboard = document.getElementById('scoreboard');

function render() {
  renderScoreboard();
  if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'roundselect') renderRoundSelect();
  else if (state.screen === 'board') renderBoard();
  else if (state.screen === 'winner') renderWinner();
}

function renderScoreboard() {
  if (state.screen === 'setup' || state.screen === 'roundselect' || state.teams.length === 0) {
    $scoreboard.style.display = 'none';
    return;
  }
  $scoreboard.style.display = 'flex';
  const maxScore = Math.max(...state.teams.map(t => t.score));
  $scoreboard.innerHTML = state.teams.map(t => `
    <div class="score-chip ${t.score === maxScore && maxScore > 0 ? 'leader' : ''}">
      <div class="name">${escapeHtml(t.name)}</div>
      <div class="pts">${t.score}</div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- Setup screen ---------- */
function renderSetup() {
  $main.innerHTML = `
    <h1 class="title">🏆 Game Night Showdown 🏆</h1>
    <div class="subtitle">Add every team or player, then hit Start</div>
    <div class="panel">
      <h2>Who's Playing?</h2>
      <div class="team-row">
        <input id="newTeamName" type="text" placeholder="Team or player name" maxlength="24" />
        <button class="btn-primary" id="addTeamBtn">Add</button>
      </div>
      <div id="teamList"></div>
      <button class="btn-primary btn-full" id="startBtn" disabled>Start Game</button>
      <div class="hint">Need at least 2 teams. Works great for couples, squads, or solo players.</div>
    </div>
  `;
  const $list = document.getElementById('teamList');
  const $start = document.getElementById('startBtn');

  function refreshList() {
    $list.innerHTML = state.teams.map(t => `
      <div class="team-entry">
        <span>${escapeHtml(t.name)}</span>
        <button class="btn-danger" data-remove="${t.id}">Remove</button>
      </div>
    `).join('');
    $start.disabled = state.teams.length < 2;
    $list.querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = () => {
        state.teams = state.teams.filter(t => t.id != btn.dataset.remove);
        refreshList();
      };
    });
  }

  function addTeam() {
    const input = document.getElementById('newTeamName');
    const name = input.value.trim();
    if (!name) return;
    state.teams.push({ id: nextTeamId++, name, score: 0, wildcardGain: 0, biggestSwing: 0, maxStreak: 0, currentStreak: 0 });
    input.value = '';
    input.focus();
    refreshList();
  }

  document.getElementById('addTeamBtn').onclick = addTeam;
  document.getElementById('newTeamName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTeam();
  });
  $start.onclick = () => {
    if (state.teams.length >= 2) {
      state.readerIndex = 0;
      state.screen = 'roundselect';
      render();
    }
  };
  refreshList();
}

/* ---------- Round select screen ---------- */
function renderRoundSelect() {
  $main.innerHTML = `
    <h1 class="title">🏆 Game Night Showdown 🏆</h1>
    <div class="subtitle">Pick tonight's board</div>
    <div class="panel" style="max-width:640px;">
      <h2>Choose a Round</h2>
      <div id="roundList" style="display:flex;flex-direction:column;gap:12px;"></div>
      <div class="hint" style="margin-top:14px;">Each round is a full, separate board — play one tonight, save the others for next time.</div>
    </div>
  `;
  const $list = document.getElementById('roundList');
  $list.innerHTML = ROUNDS.map((r, i) => `
    <button class="btn-secondary" data-round="${i}" style="text-align:left;padding:16px 18px;">
      <div style="font-size:1.1rem;font-weight:900;color:var(--gold);">${escapeHtml(r.name)}</div>
      <div style="opacity:.75;font-size:.9rem;margin-top:4px;">${escapeHtml(r.tagline)}</div>
    </button>
  `).join('');
  $list.querySelectorAll('[data-round]').forEach(btn => {
    btn.onclick = () => {
      state.roundIndex = parseInt(btn.dataset.round, 10);
      state.used = {};
      state.readerIndex = 0;
      state.screen = 'board';
      render();
    };
  });
}

/* ---------- Board screen ---------- */
function renderBoard() {
  const round = currentRound();
  const usedCount = Object.keys(state.used).length;
  const totalCells = totalCellsForRound();
  const cats = round.categories.map(c => `<div class="cat-header">${escapeHtml(c)}</div>`).join('');

  const rows = VALUES.map(v => {
    return round.categories.map(cat => {
      const key = cat + '|' + v;
      const isUsed = !!state.used[key];
      const label = isUsed ? '' : v;
      return `<div class="cell ${isUsed ? 'used' : 'clickable'}" data-cat="${escapeHtml(cat)}" data-val="${v}">${label}</div>`;
    }).join('');
  }).join('');

  const reader = currentReader();

  $main.innerHTML = `
    <h1 class="title" style="margin-top:4px;">🏆 ${escapeHtml(round.name)} 🏆</h1>
    ${reader ? `<div class="reader-banner">🎤 <strong>${escapeHtml(reader.name)}</strong>'s turn to pick &amp; read — anyone can still answer!</div>` : ''}
    <div id="board">${cats}${rows}</div>
    <div id="boardControls">
      <button class="btn-secondary" id="resetBtn">Reset Game</button>
      <button class="btn-secondary" id="changeRoundBtn">Change Round</button>
      <span class="hint" style="align-self:center;">${usedCount} / ${totalCells} squares revealed</span>
    </div>
  `;

  $main.querySelectorAll('.cell.clickable').forEach(cell => {
    cell.onclick = () => {
      const cat = cell.dataset.cat;
      const val = parseInt(cell.dataset.val, 10);
      openSquare(cat, val);
    };
  });

  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Reset this round? Scores and revealed squares will be cleared.')) {
      state.used = {};
      state.readerIndex = 0;
      state.lastCorrectTeamId = null;
      state.teams.forEach(resetTeamStats);
      render();
    }
  };

  document.getElementById('changeRoundBtn').onclick = () => {
    if (confirm('Switch to a different round? This round\'s progress will be cleared (scores stay).')) {
      state.used = {};
      state.readerIndex = 0;
      state.screen = 'roundselect';
      render();
    }
  };

  if (usedCount === totalCells && totalCells > 0) {
    state.screen = 'winner';
    render();
  }
}

/* ---------- Question / Wildcard overlay ---------- */
function openSquare(cat, val) {
  const round = currentRound();
  const dd = round.dailyDouble;
  if (dd && dd.category === cat && dd.value === val) { openDailyDouble(cat, val); return; }
  const isWild = round.wildcardSlots[cat] === val;
  if (isWild) openWildcard(cat, val);
  else openQuestion(cat, val);
}

function closeOverlay() {
  const ov = document.getElementById('overlay');
  if (ov) ov.remove();
}

function markUsedAndReturn(cat, val) {
  state.used[cat + '|' + val] = true;
  advanceReader();
  closeOverlay();
  render();
}

function teamButtonsHtml(idPrefix) {
  return `<div class="team-btn-grid">${state.teams.map(t =>
    `<button class="team-btn" data-team="${t.id}" data-prefix="${idPrefix}">${escapeHtml(t.name)}</button>`
  ).join('')}</div>`;
}

function openQuestion(cat, val) {
  const item = currentRound().questions[cat][val];
  const overlay = document.createElement('div');
  overlay.id = 'overlay';
  overlay.innerHTML = `
    <div class="card">
      <div class="tag">${escapeHtml(cat)} — ${val} pts</div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <button class="btn-primary" id="revealBtn">Reveal Answer</button>
      <div id="answerArea"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('revealBtn').onclick = () => {
    document.getElementById('revealBtn').remove();
    document.getElementById('answerArea').innerHTML = `
      <div class="atext">${escapeHtml(item.a)}</div>
      <div>Who got it right?</div>
      ${teamButtonsHtml('award')}
      <button class="btn-secondary none-btn" id="noneBtn">Nobody Scored</button>
    `;
    document.querySelectorAll('[data-prefix="award"]').forEach(btn => {
      btn.onclick = () => {
        const team = state.teams.find(t => t.id == btn.dataset.team);
        scoreEvent(team, val, { isAnswer: true });
        playCorrect();
        markUsedAndReturn(cat, val);
      };
    });
    document.getElementById('noneBtn').onclick = () => {
      playWrong();
      markUsedAndReturn(cat, val);
    };
  };
}

/* ---------- Daily Double ---------- */
function openDailyDouble(cat, val) {
  const item = currentRound().questions[cat][val];
  const reader = currentReader();
  const maxWager = Math.max(reader.score, 500);
  playDailyDouble();
  const overlay = document.createElement('div');
  overlay.id = 'overlay';
  overlay.innerHTML = `
    <div class="card">
      <div class="tag dd">🎯 DAILY DOUBLE! 🎯</div>
      <div class="catval">${escapeHtml(cat)}</div>
      <div class="wild-desc"><strong>${escapeHtml(reader.name)}</strong>, you picked it — you wager, you answer. No steals.</div>
      <div style="margin:16px 0;">
        <input type="number" id="wagerInput" min="0" max="${maxWager}" value="${Math.min(reader.score || 200, 500) || 200}" style="width:140px;padding:10px;border-radius:8px;border:none;font-size:1.2rem;text-align:center;">
      </div>
      <div class="row-gap">
        <button class="btn-secondary" data-wager="100">100</button>
        <button class="btn-secondary" data-wager="300">300</button>
        <button class="btn-secondary" data-wager="500">500</button>
        <button class="btn-secondary" data-wager="${Math.max(reader.score, 100)}">ALL IN</button>
      </div>
      <button class="btn-primary" id="lockWagerBtn" style="margin-top:16px;">Lock In Wager</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const $input = document.getElementById('wagerInput');
  document.querySelectorAll('[data-wager]').forEach(btn => {
    btn.onclick = () => { $input.value = btn.dataset.wager; };
  });

  document.getElementById('lockWagerBtn').onclick = () => {
    let wager = parseInt($input.value, 10);
    if (isNaN(wager) || wager < 0) wager = 0;
    if (wager > maxWager) wager = maxWager;
    const card = document.querySelector('#overlay .card');
    card.innerHTML = `
      <div class="tag dd">🎯 DAILY DOUBLE — ${wager} PTS 🎯</div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <button class="btn-primary" id="revealDDBtn">Reveal Answer</button>
      <div id="ddAnswerArea"></div>
    `;
    document.getElementById('revealDDBtn').onclick = () => {
      document.getElementById('revealDDBtn').remove();
      document.getElementById('ddAnswerArea').innerHTML = `
        <div class="atext">${escapeHtml(item.a)}</div>
        <div class="row-gap">
          <button class="btn-primary" id="ddRightBtn">Got It Right (+${wager})</button>
          <button class="btn-secondary" id="ddWrongBtn">Got It Wrong (−${wager})</button>
        </div>
      `;
      document.getElementById('ddRightBtn').onclick = () => {
        scoreEvent(reader, wager, { isAnswer: true });
        playCorrect();
        markUsedAndReturn(cat, val);
      };
      document.getElementById('ddWrongBtn').onclick = () => {
        scoreEvent(reader, -wager, { isAnswer: false });
        playWrong();
        markUsedAndReturn(cat, val);
      };
    };
  };
}

function openWildcard(cat, val) {
  const overlay = document.createElement('div');
  overlay.id = 'overlay';
  overlay.innerHTML = `
    <div class="card">
      <div class="tag wild">★ Wildcard — ${escapeHtml(cat)} (${val} pts) ★</div>
      <div class="catval">Who picked this square?</div>
      ${teamButtonsHtml('picker')}
    </div>
  `;
  document.body.appendChild(overlay);

  document.querySelectorAll('[data-prefix="picker"]').forEach(btn => {
    btn.onclick = () => {
      const team = state.teams.find(t => t.id == btn.dataset.team);
      runWildcardSpin(cat, val, team);
    };
  });
}

function runWildcardSpin(cat, val, team) {
  const card = document.querySelector('#overlay .card');
  card.innerHTML = `
    <div class="tag wild">★ Wildcard ★</div>
    <div class="wild-desc"><span class="spin-text" id="spinText">Spinning...</span></div>
  `;
  playWildcardSpin();
  const spinEl = document.getElementById('spinText');
  let i = 0;
  const spinInterval = setInterval(() => {
    spinEl.textContent = WILDCARD_EVENTS[i % WILDCARD_EVENTS.length].label;
    i++;
  }, 120);

  setTimeout(() => {
    clearInterval(spinInterval);
    const event = WILDCARD_EVENTS[Math.floor(Math.random() * WILDCARD_EVENTS.length)];
    showWildcardResult(cat, val, team, event);
  }, 1400);
}

function showWildcardResult(cat, val, team, event) {
  playWildcardReveal();
  const card = document.querySelector('#overlay .card');
  const descText = event.describe(val, state, team);

  if (event.isBonusQuestion) {
    const bonus = BONUS_QUESTIONS[Math.floor(Math.random() * BONUS_QUESTIONS.length)];
    card.innerHTML = `
      <div class="tag wild">${event.label}</div>
      <div class="wild-desc">${escapeHtml(descText)}</div>
      <div class="qtext">${escapeHtml(bonus.q)}</div>
      <button class="btn-primary" id="revealBonusBtn">Reveal Answer</button>
      <div id="bonusAnswerArea"></div>
    `;
    document.getElementById('revealBonusBtn').onclick = () => {
      document.getElementById('revealBonusBtn').remove();
      document.getElementById('bonusAnswerArea').innerHTML = `
        <div class="atext">${escapeHtml(bonus.a)}</div>
        <div>Who got it right?</div>
        ${teamButtonsHtml('bonusaward')}
        <button class="btn-secondary none-btn" id="bonusNoneBtn">Nobody Got It</button>
      `;
      document.querySelectorAll('[data-prefix="bonusaward"]').forEach(btn => {
        btn.onclick = () => {
          const winner = state.teams.find(t => t.id == btn.dataset.team);
          scoreEvent(winner, val * 2, { isAnswer: true, isWildcard: true });
          playCorrect();
          markUsedAndReturn(cat, val);
        };
      });
      document.getElementById('bonusNoneBtn').onclick = () => {
        if (event.key === 'doubledown') scoreEvent(team, -val, { isWildcard: true });
        playWrong();
        markUsedAndReturn(cat, val);
      };
    };
    return;
  }

  if (event.needsTarget) {
    const others = state.teams.filter(t => t !== team);
    card.innerHTML = `
      <div class="tag wild">${event.label}</div>
      <div class="wild-desc">${escapeHtml(descText)}</div>
      <div class="team-btn-grid">${others.map(t =>
        `<button class="team-btn" data-target="${t.id}">${escapeHtml(t.name)}</button>`
      ).join('')}</div>
    `;
    card.querySelectorAll('[data-target]').forEach(btn => {
      btn.onclick = () => {
        const targetTeam = state.teams.find(t => t.id == btn.dataset.target);
        const before = team.score;
        event.apply(state, team, val, targetTeam);
        team.wildcardGain = (team.wildcardGain || 0) + (team.score - before);
        team.biggestSwing = Math.max(team.biggestSwing || 0, team.score - before);
        markUsedAndReturn(cat, val);
      };
    });
    return;
  }

  // Instant effect, no target needed
  const scoreBefore = team.score;
  event.apply(state, team, val);
  const instantDelta = team.score - scoreBefore;
  team.wildcardGain = (team.wildcardGain || 0) + instantDelta;
  team.biggestSwing = Math.max(team.biggestSwing || 0, instantDelta);
  card.innerHTML = `
    <div class="tag wild">${event.label}</div>
    <div class="wild-desc">${escapeHtml(descText)}</div>
    <button class="btn-primary" id="continueBtn">Continue</button>
  `;
  document.getElementById('continueBtn').onclick = () => markUsedAndReturn(cat, val);
}

/* ---------- Superlatives (end-of-game awards) ---------- */
function computeSuperlatives() {
  const teams = state.teams;
  const awards = [];
  if (teams.length === 0) return awards;

  const byBiggestSwing = [...teams].sort((a, b) => (b.biggestSwing || 0) - (a.biggestSwing || 0))[0];
  if (byBiggestSwing && byBiggestSwing.biggestSwing > 0) {
    awards.push({ label: '💥 Comeback Kid (biggest single-question swing)', team: byBiggestSwing, detail: `+${byBiggestSwing.biggestSwing} in one shot` });
  }

  const byWildcard = [...teams].sort((a, b) => (b.wildcardGain || 0) - (a.wildcardGain || 0))[0];
  if (byWildcard && (byWildcard.wildcardGain || 0) > 0) {
    awards.push({ label: '🍀 Wildcard Whisperer (luckiest with wildcards)', team: byWildcard, detail: `net +${byWildcard.wildcardGain} from wildcards` });
  }

  const byStreak = [...teams].sort((a, b) => (b.maxStreak || 0) - (a.maxStreak || 0))[0];
  if (byStreak && (byStreak.maxStreak || 0) >= 2) {
    awards.push({ label: '🧊 Ice in Their Veins (longest correct streak)', team: byStreak, detail: `${byStreak.maxStreak} correct in a row` });
  }

  return awards;
}

/* ---------- Winner screen ---------- */
function renderWinner() {
  const sorted = [...state.teams].sort((a, b) => b.score - a.score);
  const top = sorted[0];
  const awards = computeSuperlatives();
  $main.innerHTML = `
    <h1 class="title">🎉 Game Over! 🎉</h1>
    <div class="panel" style="text-align:center;">
      <div class="medal">🏆</div>
      <div>Champion</div>
      <div class="winner-name">${escapeHtml(top.name)}</div>
      <div style="font-size:1.3rem;color:var(--gold);font-weight:900;">${top.score} points</div>
      <div style="margin-top:20px;text-align:left;">
        ${sorted.map((t, i) => `
          <div class="team-entry" style="margin-bottom:6px;">
            <span>${i + 1}. ${escapeHtml(t.name)}</span>
            <span style="font-weight:900;color:var(--gold);">${t.score}</span>
          </div>
        `).join('')}
      </div>
      ${awards.length > 0 ? `
        <div class="superlatives">
          <div style="text-align:center;color:var(--gold);font-weight:900;margin-bottom:10px;">🎖️ Awards of the Night 🎖️</div>
          ${awards.map(a => `
            <div class="superlative-row">
              <span class="label">${escapeHtml(a.label)}</span>
              <span class="winner">${escapeHtml(a.team.name)} <span style="opacity:.7;font-weight:400;">(${escapeHtml(a.detail)})</span></span>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <button class="btn-primary btn-full" id="playAgainBtn">Play Again (Same Round)</button>
      <button class="btn-secondary btn-full" id="newRoundBtn">Play a Different Round</button>
      <button class="btn-secondary btn-full" id="newGameBtn">New Game (Reset Everyone)</button>
    </div>
  `;
  launchConfetti();
  document.getElementById('playAgainBtn').onclick = () => {
    state.used = {};
    state.readerIndex = 0;
    state.lastCorrectTeamId = null;
    state.teams.forEach(resetTeamStats);
    state.screen = 'board';
    render();
  };
  document.getElementById('newRoundBtn').onclick = () => {
    state.used = {};
    state.readerIndex = 0;
    state.screen = 'roundselect';
    render();
  };
  document.getElementById('newGameBtn').onclick = () => {
    state = { teams: [], used: {}, screen: 'setup', roundIndex: 0, readerIndex: 0 };
    render();
  };
}

function launchConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#f5c518', '#2ecc71', '#e74c3c', '#3498db', '#8e44ad'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 1.5) + 's';
    wrap.appendChild(el);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 5000);
}

render();
</script>
